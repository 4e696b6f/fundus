<!--
  fundus · Ansicht (v0)
  Eine Datei, ohne Netz und ohne Fremdbibliothek. Liest einen fundus-Ordner,
  den du im Browser auswählst, und zeigt ihn an. Schreibt nichts, sendet nichts.
  Aufbau: Stil · Skript „fundus-kern“ (Logik ohne DOM, testbar) ·
  Skript „fundus-ui“ (Oberfläche). Anleitung: handbuch/ANSICHT.md
-->
<style>
:root {
  --schrift: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --t-1: 12px; --t-2: 13px; --t-3: 15px; --t-4: 17px; --t-5: 21px; --t-6: 28px;
  --r-1: 6px; --r-2: 10px; --r-3: 16px; --r-voll: 999px;
  --a-1: 4px; --a-2: 8px; --a-3: 12px; --a-4: 16px; --a-5: 24px; --a-6: 32px;
  --breite: 1240px; --lese: 760px;

  --grund: #f5f7f6; --flaeche: #ffffff; --flaeche-2: #eef2f1; --flaeche-3: #e3e9e7;
  --text: #191c1c; --text-2: #48504f; --text-3: #6b7473; --linie: #d5dcda; --linie-2: #bfc8c6;
  --primaer: #1d6b65; --auf-primaer: #ffffff; --primaer-ton: #d3ebe6; --auf-primaer-ton: #0a3632;
  --warn: #a2401a; --warn-ton: #fbe3d7; --bald: #7c5a00; --bald-ton: #f6ebc8;
  --gut: #2e6a3a; --gut-ton: #dcefd9; --tot: #b3261e; --tot-ton: #fbe0dd;
  --ich: 138 98 58; --info: #2b5f9e; --info-ton: #dde8f7; --lila: #6a4b9a; --lila-ton: #ebe2f6;
  --code: #eef2f1; --markiert: #fbeea6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-thema="hell"]) {
    --grund: #0f1312; --flaeche: #171c1b; --flaeche-2: #1f2524; --flaeche-3: #29302f;
    --text: #e1e4e3; --text-2: #aeb7b5; --text-3: #8a9492; --linie: #313937; --linie-2: #414a48;
    --primaer: #82d2c8; --auf-primaer: #00312d; --primaer-ton: #1b3d39; --auf-primaer-ton: #c4ede7;
    --warn: #ffb599; --warn-ton: #4a2616; --bald: #ecc76b; --bald-ton: #3b3013;
    --gut: #9fd6a3; --gut-ton: #1d3620; --tot: #ffb4ab; --tot-ton: #4b1d19;
    --ich: 201 164 120; --info: #a9c7ff; --info-ton: #1d3050; --lila: #d2bcff; --lila-ton: #33284a;
    --code: #1f2524; --markiert: #5a4d10;
  }
}
:root[data-thema="dunkel"] {
  --grund: #0f1312; --flaeche: #171c1b; --flaeche-2: #1f2524; --flaeche-3: #29302f;
  --text: #e1e4e3; --text-2: #aeb7b5; --text-3: #8a9492; --linie: #313937; --linie-2: #414a48;
  --primaer: #82d2c8; --auf-primaer: #00312d; --primaer-ton: #1b3d39; --auf-primaer-ton: #c4ede7;
  --warn: #ffb599; --warn-ton: #4a2616; --bald: #ecc76b; --bald-ton: #3b3013;
  --gut: #9fd6a3; --gut-ton: #1d3620; --tot: #ffb4ab; --tot-ton: #4b1d19;
  --ich: 201 164 120; --info: #a9c7ff; --info-ton: #1d3050; --lila: #d2bcff; --lila-ton: #33284a;
  --code: #1f2524; --markiert: #5a4d10;
  color-scheme: dark;
}
:root[data-thema="hell"] { color-scheme: light; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--grund); color: var(--text); font: var(--t-3)/1.55 var(--schrift); }
a { color: var(--primaer); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--primaer); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 0; }
.stumm { color: var(--text-3); }
.klein { font-size: var(--t-2); }

/* Leiste */
.leiste { position: sticky; top: 0; z-index: 5; background: var(--grund); border-bottom: 1px solid var(--linie); }
.leiste-innen { max-width: var(--breite); margin: 0 auto; padding: var(--a-2) var(--a-5); display: flex; align-items: center; gap: var(--a-4); min-height: 56px; flex-wrap: wrap; }
.marke { font-weight: 650; font-size: var(--t-4); color: var(--text); display: flex; align-items: baseline; gap: var(--a-2); }
.marke small { font-weight: 400; color: var(--text-3); font-size: var(--t-2); }
.navi { display: flex; gap: var(--a-1); }
.navi a { padding: 6px 14px; border-radius: var(--r-voll); color: var(--text-2); font-weight: 550; }
.navi a:hover { background: var(--flaeche-2); text-decoration: none; }
.navi a[aria-current="page"] { background: var(--primaer-ton); color: var(--auf-primaer-ton); }
.leiste-rechts { margin-left: auto; display: flex; align-items: center; gap: var(--a-2); flex-wrap: wrap; }
.lesezeit { font-size: var(--t-1); color: var(--text-3); }

/* Knöpfe */
.knopf { font: inherit; font-size: var(--t-2); font-weight: 600; border: 1px solid var(--linie-2); background: transparent; color: var(--text); padding: 7px 14px; border-radius: var(--r-voll); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; line-height: 1.2; }
.knopf:hover { background: var(--flaeche-2); text-decoration: none; }
.knopf.primaer { background: var(--primaer); color: var(--auf-primaer); border-color: var(--primaer); }
.knopf.primaer:hover { filter: brightness(1.08); }
.knopf.ton { background: var(--primaer-ton); color: var(--auf-primaer-ton); border-color: transparent; }
.knopf.gross { font-size: var(--t-3); padding: 12px 24px; }

main { max-width: var(--breite); margin: 0 auto; padding: var(--a-5); }

/* Start */
.start { max-width: 620px; margin: 12vh auto 0; }
.start h1 { font-size: var(--t-6); margin-bottom: var(--a-3); }
.start .satz { font-size: var(--t-4); color: var(--text-2); margin: 0 0 var(--a-5); }
.start .knoepfe { display: flex; flex-wrap: wrap; gap: var(--a-3); margin-bottom: var(--a-5); }
.start .zusicherung { font-weight: 600; margin: 0 0 var(--a-2); }
.start .hinweis { color: var(--text-3); font-size: var(--t-2); margin: 0 0 var(--a-2); }
.start .fehler { color: var(--tot); }
.laden { color: var(--text-2); }

/* Übersicht */
.kopf { display: flex; flex-wrap: wrap; gap: var(--a-5); align-items: flex-end; justify-content: space-between; margin: var(--a-2) 0 var(--a-5); }
.kopf-label { font-size: var(--t-1); text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; }
.kopf h1 { font-size: var(--t-6); margin: 2px 0 4px; word-break: break-word; }
.kopf-stand { margin: 0; color: var(--text-2); }
.kennzahlen { display: flex; flex-wrap: wrap; gap: var(--a-2); margin: 0; }
.kennzahlen div { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r-2); padding: 8px 14px; min-width: 96px; }
.kennzahlen dt { font-size: var(--t-1); color: var(--text-3); }
.kennzahlen dd { margin: 0; font-size: var(--t-5); font-weight: 650; font-variant-numeric: tabular-nums; }
.kennzahlen a { color: inherit; }

.naechster { background: var(--primaer-ton); color: var(--auf-primaer-ton); border-radius: var(--r-3); padding: var(--a-4) var(--a-5); margin-bottom: var(--a-4); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--a-2) var(--a-5); align-items: start; }
.naechster .kachel-label { color: inherit; opacity: .8; }
.naechster .schritt { font-size: var(--t-4); font-weight: 600; margin: 4px 0 0; }
.naechster .schritt p { margin: 0; }
.naechster a { color: inherit; text-decoration: underline; }
.naechster .mehr { grid-column: 1 / -1; }
.naechster details summary { cursor: pointer; font-size: var(--t-2); font-weight: 600; }
.naechster .uebergabe-text { font-size: var(--t-2); margin-top: var(--a-2); }
.naechster .uebergabe-text h3 { font-size: var(--t-2); margin: var(--a-3) 0 var(--a-1); }
.naechster .uebergabe-text ul { margin: 0; padding-left: 20px; }

.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--a-4); align-items: start; }
.raster + .raster { margin-top: var(--a-4); }
.kachel { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r-3); padding: var(--a-4) var(--a-4) var(--a-3); min-width: 0; }
.kachel-kopf { margin-bottom: var(--a-3); }
.kachel-label { font-size: var(--t-1); text-transform: uppercase; letter-spacing: .06em; font-weight: 650; color: var(--text-3); display: flex; align-items: center; gap: var(--a-2); }
.zahl { display: inline-block; min-width: 22px; padding: 1px 7px; border-radius: var(--r-voll); background: var(--flaeche-3); color: var(--text); font-size: var(--t-1); text-align: center; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.kachel-frage { font-size: var(--t-3); font-weight: 600; margin-top: 4px; color: var(--text); }
.kachel.warn { border-color: var(--warn); }
.kachel.warn .kachel-label { color: var(--warn); }
.kachel.warn .zahl { background: var(--warn-ton); color: var(--warn); }
.kachel.bald .kachel-label { color: var(--bald); }
.kachel.bald .zahl { background: var(--bald-ton); color: var(--bald); }
.kachel.ruhig .kachel-frage { color: var(--text-2); }
.leer { margin: 0; color: var(--text-3); font-size: var(--t-2); }
.leer code { font-size: 12px; }
.eintraege { list-style: none; margin: 0; padding: 0; }
.eintraege li { padding: 7px 0; border-top: 1px solid var(--linie); display: flex; gap: var(--a-3); align-items: baseline; justify-content: space-between; min-width: 0; }
.eintraege li:first-child { border-top: 0; padding-top: 0; }
.eintraege .haupt { min-width: 0; overflow-wrap: anywhere; }
.eintraege .neben { flex: none; font-size: var(--t-1); color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums; }
.eintraege .unter { display: block; font-size: var(--t-1); color: var(--text-3); }
.eintraege.zeilen li { display: block; font-size: var(--t-2); }
.frist.faellig { color: var(--warn); font-weight: 600; }
.frist.bald { color: var(--bald); font-weight: 600; }
.balken { height: 4px; background: var(--flaeche-3); border-radius: 2px; margin-top: 4px; }
.balken span { display: block; height: 100%; background: var(--primaer); border-radius: 2px; }
.typen { font-size: var(--t-1); color: var(--text-3); }
.kachel .alle { display: inline-block; margin-top: var(--a-2); font-size: var(--t-2); font-weight: 600; }

/* Liste */
.reiter { display: flex; gap: var(--a-1); border-bottom: 1px solid var(--linie); margin-bottom: var(--a-4); overflow-x: auto; }
.reiter a { padding: 10px 14px; color: var(--text-2); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.reiter a:hover { text-decoration: none; color: var(--text); }
.reiter a[aria-current="page"] { color: var(--primaer); border-bottom-color: var(--primaer); }
.reiter .zahl { margin-left: 4px; }
.filter { display: flex; flex-wrap: wrap; gap: var(--a-2); align-items: center; margin-bottom: var(--a-3); }
.filter input[type="search"] { flex: 1 1 260px; min-width: 200px; }
.filter input, .filter select { font: inherit; font-size: var(--t-2); color: var(--text); background: var(--flaeche); border: 1px solid var(--linie-2); border-radius: var(--r-2); padding: 7px 10px; }
.filter select { max-width: 200px; }
.treffer { font-size: var(--t-2); color: var(--text-3); margin: 0 0 var(--a-2); }
.tabelle-rahmen { overflow-x: auto; background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r-3); }
table.liste { width: 100%; border-collapse: collapse; font-size: var(--t-2); }
table.liste th { text-align: left; font-weight: 600; color: var(--text-3); font-size: var(--t-1); text-transform: uppercase; letter-spacing: .04em; padding: 10px 12px; border-bottom: 1px solid var(--linie); white-space: nowrap; }
table.liste td { padding: 9px 12px; border-top: 1px solid var(--linie); vertical-align: top; }
table.liste tr:first-child td { border-top: 0; }
table.liste tbody tr { cursor: pointer; }
table.liste tbody tr:hover { background: var(--flaeche-2); }
table.liste .titel { font-weight: 600; }
table.liste .pfad { font-size: var(--t-1); color: var(--text-3); overflow-wrap: anywhere; }
table.liste .ausschnitt { font-size: var(--t-1); color: var(--text-2); margin-top: 2px; }
table.liste .zahlspalte { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.liste .gruppe td { background: var(--flaeche-2); font-weight: 650; cursor: default; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-1); padding: 3px 9px; border-radius: var(--r-voll); background: var(--flaeche-2); color: var(--text-2); border: 1px solid transparent; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip b { font-weight: 600; color: var(--text); }
.chip.typ { background: var(--primaer-ton); color: var(--auf-primaer-ton); font-weight: 600; }
.chip.warn, .chip.faellig, .chip.strittig { background: var(--warn-ton); color: var(--warn); font-weight: 600; }
.chip.bald { background: var(--bald-ton); color: var(--bald); font-weight: 600; }
.chip.ich { background: rgb(var(--ich) / .14); color: rgb(var(--ich)); font-weight: 600; }
.chip.gedaempft { background: transparent; border-color: var(--linie-2); }
.chip.fehler { background: var(--tot-ton); color: var(--tot); font-weight: 600; }
.chip.tag { background: transparent; border-color: var(--linie); }

/* Dokument */
.dok { display: grid; grid-template-columns: minmax(0, var(--lese)) minmax(220px, 1fr); gap: var(--a-6); align-items: start; }
.dok-kopf { grid-column: 1 / -1; }
.pfadleiste { font-size: var(--t-2); color: var(--text-3); display: flex; flex-wrap: wrap; gap: var(--a-2); align-items: center; justify-content: space-between; margin-bottom: var(--a-3); }
.pfadleiste .knoepfe { display: flex; gap: var(--a-2); flex-wrap: wrap; }
.dok-kopf h1 { font-size: var(--t-6); margin: 0 0 var(--a-3); overflow-wrap: anywhere; }
.felder { margin: var(--a-4) 0 0; background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r-2); padding: var(--a-3) var(--a-4); font-size: var(--t-2); }
.felder summary { cursor: pointer; font-weight: 600; color: var(--text-2); }
.felder dl { margin: var(--a-2) 0 0; display: grid; grid-template-columns: minmax(90px, max-content) minmax(0, 1fr); gap: 6px var(--a-4); }
.felder dt { color: var(--text-3); font-family: var(--mono); font-size: var(--t-1); padding-top: 2px; }
.felder dd { margin: 0; overflow-wrap: anywhere; }
.felder dd ul { margin: 0; padding-left: 18px; }
.fm-fehler { margin: var(--a-3) 0 0; background: var(--tot-ton); color: var(--tot); border-radius: var(--r-2); padding: var(--a-3) var(--a-4); font-size: var(--t-2); }
.fm-fehler pre { color: var(--text); background: var(--flaeche); margin: var(--a-2) 0 0; }
.seite-rand { grid-column: 2; grid-row: 2 / span 2; position: sticky; top: 76px; font-size: var(--t-2); display: flex; flex-direction: column; gap: var(--a-4); max-height: calc(100vh - 96px); overflow-y: auto; }
.rand-block h2 { font-size: var(--t-1); text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin-bottom: var(--a-2); }
.rand-block ol { list-style: none; margin: 0; padding: 0; }
.rand-block li { padding: 3px 0; overflow-wrap: anywhere; }
.rand-block li.e3 { padding-left: 12px; } .rand-block li.e4, .rand-block li.e5, .rand-block li.e6 { padding-left: 24px; }
.verweise { grid-column: 1; border-top: 1px solid var(--linie); padding-top: var(--a-4); display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--a-5); font-size: var(--t-2); }
.verweise h2 { font-size: var(--t-1); text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin-bottom: var(--a-2); }
.verweise ul { list-style: none; margin: 0; padding: 0; }
.verweise li { padding: 4px 0; overflow-wrap: anywhere; }
.verweise .art { font-size: var(--t-1); color: var(--text-3); }
.anhang-karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r-3); padding: var(--a-5); max-width: var(--lese); }

/* Markdown */
.md { font-size: 16px; line-height: 1.65; overflow-wrap: break-word; min-width: 0; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1.6em 0 .5em; scroll-margin-top: 80px; }
.md h1 { font-size: 26px; } .md h2 { font-size: 21px; } .md h3 { font-size: 18px; } .md h4, .md h5, .md h6 { font-size: 16px; }
.md p { margin: .7em 0; }
.md ul, .md ol { padding-left: 1.5em; margin: .6em 0; }
.md li { margin: .2em 0; }
.md li > ul, .md li > ol { margin: .2em 0; }
.md li.aufgabe { list-style: none; margin-left: -1.4em; }
.md li.aufgabe input { margin: 0 .45em 0 0; vertical-align: -1px; }
.md li.erledigt { color: var(--text-3); }
.md code { font-family: var(--mono); font-size: .88em; background: var(--code); padding: .1em .35em; border-radius: 4px; }
.md pre { background: var(--code); padding: var(--a-3) var(--a-4); border-radius: var(--r-2); overflow-x: auto; font-size: 13.5px; line-height: 1.5; }
.md pre code { background: none; padding: 0; font-size: inherit; }
.md blockquote { margin: 1em 0; padding: .1em 1em; border-left: 3px solid var(--linie-2); color: var(--text-2); }
.md hr { border: 0; border-top: 1px solid var(--linie); margin: 1.6em 0; }
.md mark { background: var(--markiert); color: inherit; padding: 0 2px; }
.md img { max-width: 100%; height: auto; border-radius: var(--r-1); }
.md .tabelle { overflow-x: auto; margin: 1em 0; }
.md table { border-collapse: collapse; font-size: 14px; }
.md th, .md td { border: 1px solid var(--linie); padding: 6px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--flaeche-2); font-weight: 600; }
.md .tag { color: var(--primaer); background: var(--primaer-ton); padding: 0 6px; border-radius: var(--r-voll); font-size: .88em; }
.md a.extern::after { content: " ↗"; font-size: .8em; }
.link-tot { color: var(--tot); text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
a.mehrdeutig { text-decoration: underline dotted; }
.einbettung { display: inline-block; padding: 2px 8px; border: 1px dashed var(--linie-2); border-radius: var(--r-1); font-size: .92em; }
.callout { --c: var(--info); --c-ton: var(--info-ton); margin: 1em 0; border-radius: var(--r-2); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); background: var(--c-ton); padding: .6em 1em; color: var(--text); }
.callout > .callout-titel, .callout > summary { font-weight: 650; color: var(--c); display: flex; gap: 6px; align-items: center; }
.callout > summary { cursor: pointer; }
.callout-inhalt > :first-child { margin-top: .3em; } .callout-inhalt > :last-child { margin-bottom: .2em; }
.callout[data-farbe="tip"] { --c: var(--gut); --c-ton: var(--gut-ton); }
.callout[data-farbe="warning"] { --c: var(--bald); --c-ton: var(--bald-ton); }
.callout[data-farbe="danger"] { --c: var(--tot); --c-ton: var(--tot-ton); }
.callout[data-farbe="example"] { --c: var(--lila); --c-ton: var(--lila-ton); }
.callout[data-farbe="quote"] { --c: var(--text-2); --c-ton: var(--flaeche-2); }
.callout[data-farbe="ich"] { --c: rgb(var(--ich)); --c-ton: rgb(var(--ich) / .09); border-color: rgb(var(--ich) / .35); border-left: 4px solid rgb(var(--ich)); }
.callout[data-farbe="ich"] .callout-inhalt { font-style: normal; }
.callout svg { width: 16px; height: 16px; flex: none; }

  /* ---------- Dokument ---------- */
  var CHIP_FOLGE = ['type', 'status', 'sicherheit', 'stimme', 'id', 'art', 'schwere', 'modul', 'version', 'created', 'updated', 'stand', 'geprueft', 'pruefen_bis', 'verfaellt', 'einrichtung', 'land', 'gilt_fuer', 'sprache', 'lizenz', 'fundus', 'ergebnisse', 'confidence'];
  var DATUMSFELD = { created: 'angelegt', updated: 'aktualisiert', stand: 'Stand', geprueft: 'geprüft', pruefen_bis: 'prüfen bis', verfaellt: 'verfällt' };
  function chips(d) {
    var fm = d.fm, aus = [], lang = [], gesehen = { title: 1, titel: 1, tags: 1, aliases: 1, quellen: 1 };
    var schluessel = CHIP_FOLGE.filter(function (k) { return k in fm; }).concat(Object.keys(fm).filter(function (k) { return CHIP_FOLGE.indexOf(k) < 0; }));
    schluessel.forEach(function (k) {

      if (!kurz) { lang.push(k); return; }

    if (v == null) return '';
    if (Array.isArray(v)) return '<ul>' + v.map(function (x) { return '<li>' + feldWert(d, x) + '</li>'; }).join('') + '</ul>';
    if (typeof v === 'object') return Object.keys(v).map(function (k) { return '<code>' + esc(k) + '</code> ' + feldWert(d, v[k]); }).join(' · ');
    return inlineVon(d, String(v));
  }
  function quellenWert(d) {
    var q = K.liste(d.fm.quellen); if (!q.length) return '';
    return '<ul>' + q.map(function (s) {
      var l = d.links.filter(function (x) { return x.art === 'quelle' && x.roh === s; })[0];
      if (/\[\[/.test(s)) return '<li>' + inlineVon(d, s) + '</li>';
      if (l && l.pfad) return '<li>' + docLink(S.idx.nachPfad[l.pfad], s) + '</li>';
      return '<li><span class="link-tot" title="Datei nicht gefunden">' + esc(s) + '</span></li>';
    }).join('') + '</ul>';
  }
  function zeigeDoc(pfad, anker) {
    setzeNavi('');
    var idx = S.idx, d = idx.nachPfad[pfad];
    if (!d) {
      haupt.innerHTML = '<div class="anhang-karte"><h1>Nicht gefunden</h1><p><code>' + esc(pfad) + '</code> gibt es in diesem Ordner nicht, oder die Ansicht liest diesen Ort nicht (Punkt-Ordner, <code>vorlagen/</code>).</p><p><a href="#liste">Zur Liste</a></p></div>';
      return;
    }
    var teile = d.pfad.split('/'), kette = teile.map(function (t, k) { return k < teile.length - 1 ? esc(t) + ' /' : '<b>' + esc(t) + '</b>'; }).join(' ');
    var obs = '<a class="knopf" href="' + esc(K.obsidianUri(idx.vault, d.pfad)) + '" title="Öffnet Obsidian. Klappt nur, wenn der Vault dort „' + esc(idx.vault) + '“ heißt.">In Obsidian öffnen</a>';
    var zurueck = '<button type="button" class="knopf" id="knopf-zurueck">Zurück</button>';
    var h = '<div class="dok"><div class="dok-kopf"><div class="pfadleiste"><span>' + kette + '</span><span class="knoepfe">' + zurueck +
      (d.istMd ? '' : '<button type="button" class="knopf primaer" data-datei="' + esc(d.pfad) + '">Datei öffnen</button>') + obs + '</span></div>';
    h += '<h1>' + esc(d.titel) + '</h1>';
    var rand = '';
    if (d.istMd) {
      var c = chips(d);
      h += '<div class="chips">' + c.chips + (d.fmFehler ? '<span class="chip fehler">Frontmatter fehlerhaft</span>' : '') + (!d.hatFm && d.zone === 'wiki' ? '<span class="chip gedaempft">ohne Frontmatter</span>' : '') + '</div>';
      if (d.fmFehler) h += '<div class="fm-fehler"><b>Frontmatter fehlerhaft:</b> ' + esc(d.fmFehler) + ' Obsidian zeigt die Eigenschaften dann meist rot. Die Seite ist trotzdem vollständig angezeigt.' + (d.fmRoh != null ? '<details><summary>Frontmatter als Text</summary><pre>' + esc(d.fmRoh) + '</pre></details>' : '') + '</div>';
      var qs = quellenWert(d);
      if (c.lang.length || qs) {
        h += '<details class="felder"' + (d.istLeitplanke || c.lang.length <= 3 ? ' open' : '') + '><summary>Felder (' + (c.lang.length + (qs ? 1 : 0)) + ')</summary><dl>' +
          (qs ? '<dt>quellen</dt><dd>' + qs + '</dd>' : '') +
          c.lang.map(function (k) { return '<dt>' + esc(k) + '</dt><dd>' + feldWert(d, d.fm[k]) + '</dd>'; }).join('') + '</dl></details>';
      }
      h += '</div>';
      var r = K.rendereDoc(idx, d, bildUrl);
      h += '<article class="md">' + (r.html || '<p class="leer">Diese Datei hat keinen Text unter dem Frontmatter.</p>') + '</article>';
      if (r.ueberschriften.length > 2) rand += '<div class="rand-block"><h2>Auf dieser Seite</h2><ol>' + r.ueberschriften.filter(function (u) { return u.ebene > 1 && u.ebene < 5; }).map(function (u) { return '<li class="e' + u.ebene + '"><a href="' + docHref(d.pfad, u.id.slice(2)) + '">' + esc(u.text) + '</a></li>'; }).join('') + '</ol></div>';
    } else {
      h += '<div class="chips"><span class="chip typ">' + esc(d.ext || 'Datei') + '</span><span class="chip">' + K.groesse(d.groesse) + '</span></div></div>';
      h += '<div class="anhang-karte"><p>Diese Datei zeigt die Ansicht nicht selbst an. „Datei öffnen“ öffnet sie in einem neuen Tab' + (/pdf|png|jpe?g|gif|webp/i.test(d.ext) ? '' : ' oder lädt sie herunter') + '.</p></div>';
    }
    // Links
    var aus = {}, ausListe = [];
    d.links.forEach(function (l) { var k = l.pfad || ('?' + l.roh); if (aus[k]) return; aus[k] = 1; ausListe.push(l); });
    var ARTEN = { wiki: '', einbettung: 'eingebettet', md: 'Markdown-Link', bild: 'Bild', quelle: 'quellen:', eigenschaft: 'Feld' };
    var linkZeile = function (l) {
      var ziel = l.pfad ? idx.nachPfad[l.pfad] : null;
      return '<li>' + (ziel ? docLink(ziel) : '<span class="link-tot" title="Nicht gefunden">' + esc(l.roh) + '</span>') + (ARTEN[l.art] ? ' <span class="art">' + ARTEN[l.art] + '</span>' : '') + '</li>';
    };
    var ein = d.eingehend.slice().sort(function (a, b) { return idx.nachPfad[a.pfad].titel.localeCompare(idx.nachPfad[b.pfad].titel, 'de'); });
    h += '<section class="verweise"><div><h2>Ausgehende Links · ' + ausListe.length + '</h2>' + (ausListe.length ? '<ul>' + ausListe.map(linkZeile).join('') + '</ul>' : '<p class="leer">Diese Datei verlinkt nichts.</p>') + '</div>' +
      '<div><h2>Rückverweise · ' + ein.length + '</h2>' + (ein.length ? '<ul>' + ein.map(function (e) {
        var q = idx.nachPfad[e.pfad]; return '<li>' + docLink(q) + ' <span class="art">' + esc(q.pfad) + (e.arten.indexOf('quelle') >= 0 ? ' · als Beleg' : '') + '</span></li>';
      }).join('') + '</ul>' : '<p class="leer">Keine andere Datei verlinkt hierher.</p>') + '</div></section>';
    h += '<aside class="seite-rand">' + rand + '</aside></div>';
    haupt.innerHTML = h;
    document.getElementById('knopf-zurueck').addEventListener('click', function () { if (history.length > 1) history.back(); else location.hash = '#uebersicht'; });
    if (anker) { var z = document.getElementById('h-' + anker); if (z) { z.scrollIntoView(); return true; } }
    return false;
  }

  /* ---------- Navigation ---------- */
  function leseHash() {
    var h = location.hash.replace(/^#/, '');
    if (h.indexOf('doc/') === 0) {
      var rest = h.slice(4), k = rest.indexOf('#'), p = k < 0 ? rest : rest.slice(0, k), a = k < 0 ? '' : rest.slice(k + 1);
      try { p = decodeURIComponent(p); a = decodeURIComponent(a); } catch (e) { /* roh */ }
      return { ansicht: 'doc', pfad: p, anker: a };
    }
    var m = /^liste(?:\/([a-z]+))?(?:\?(.*))?$/.exec(h);
    if (m) {
      var par = {};
      (m[2] || '').split('&').forEach(function (x) { if (!x) return; var kv = x.split('='); try { par[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); } catch (e) { /* überspringen */ } });
      return { ansicht: 'liste', reiter: m[1] || 'wiki', p: par };
    }
    return { ansicht: 'uebersicht' };
  }
  function route() {
    if (S.letzterHash) S.scroll[S.letzterHash] = window.scrollY;
    if (!S.idx) { zeigeStart(); return; }
    var r = leseHash(), gescrollt = false;
    if (r.ansicht === 'doc') gescrollt = zeigeDoc(r.pfad, r.anker);
    else if (r.ansicht === 'liste') zeigeListe(r.reiter, r.p);
    else zeigeUebersicht();
    if (!gescrollt) window.scrollTo(0, S.scroll[location.hash] || 0);
    S.letzterHash = location.hash;
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && S.idx && !/input|select|textarea/i.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); if (!/^#liste/.test(location.hash)) location.hash = '#liste'; else { var s = document.getElementById('suche'); if (s) s.focus(); } }
  });

  /* Einstieg */
  zeigeStart();
  if (hatFSA) griffHolen().then(function (h) { if (h && !S.idx) { S.letzter = h; zeigeStart(); } });
  window.FundusAnsicht = { einlesen: einlesen };
})();
</script>
