<!--
  fundus · Ansicht (v0)
  Eine Datei, ohne Netz und ohne Fremdbibliothek. Liest einen fundus-Ordner,
  den du im Browser auswählst, und zeigt ihn an. Schreibt nichts, sendet nichts.
  Die Seite „Prüfung“ und agent/werkzeug/pruefen.js benutzen dieselbe Funktion im Kern.
  Aufbau: Stil · Skript „fundus-kern“ (Logik ohne DOM, testbar) ·
  Skript „fundus-ui“ (Oberfläche). Anleitung: handbuch/ANSICHT.md
-->
<style>
:root {
  --ich-farbe: rgb(var(--ich));
  --schrift: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --t-1: 12px; --t-2: 13px; --t-3: 15px; --t-4: 17px; --t-5: 21px; --t-6: 28px;
  --r-1: 6px; --r-2: 8px; --r-3: 12px; --r-voll: 999px;
  --a-1: 4px; --a-2: 8px; --a-3: 12px; --a-4: 16px; --a-5: 24px; --a-6: 32px;
  --breite: 1240px; --lese: 760px; --leiste: 248px;

  --grund: #f5f7f6; --flaeche: #ffffff; --flaeche-2: #eef2f1; --flaeche-3: #e3e9e7;
  --text: #191c1c; --text-2: #48504f; --text-3: #5f6867; --linie: #d5dcda; --linie-2: #bfc8c6;
  --primaer: #1d6b65; --auf-primaer: #ffffff; --primaer-ton: #d3ebe6; --auf-primaer-ton: #0a3632;
  --warn: #a2401a; --warn-ton: #fbe3d7; --bald: #7c5a00; --bald-ton: #f6ebc8;
  --gut: #2e6a3a; --gut-ton: #dcefd9; --tot: #b3261e; --tot-ton: #fbe0dd;
  --ich: 138 98 58; --info: #2b5f9e; --info-ton: #dde8f7; --lila: #6a4b9a; --lila-ton: #ebe2f6;
  --code: #eef2f1; --markiert: #fbeea6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-thema="hell"]) {
    --grund: #0f1312; --flaeche: #171c1b; --flaeche-2: #1f2524; --flaeche-3: #29302f;
    --text: #e1e4e3; --text-2: #aeb7b5; --text-3: #929c9a; --linie: #313937; --linie-2: #414a48;
    --primaer: #82d2c8; --auf-primaer: #00312d; --primaer-ton: #1b3d39; --auf-primaer-ton: #c4ede7;
    --warn: #ffb599; --warn-ton: #4a2616; --bald: #ecc76b; --bald-ton: #3b3013;
    --gut: #9fd6a3; --gut-ton: #1d3620; --tot: #ffb4ab; --tot-ton: #4b1d19;
    --ich: 201 164 120; --info: #a9c7ff; --info-ton: #1d3050; --lila: #d2bcff; --lila-ton: #33284a;
    --code: #1f2524; --markiert: #5a4d10;
  }
}
:root[data-thema="dunkel"] {
  --grund: #0f1312; --flaeche: #171c1b; --flaeche-2: #1f2524; --flaeche-3: #29302f;
  --text: #e1e4e3; --text-2: #aeb7b5; --text-3: #929c9a; --linie: #313937; --linie-2: #414a48;
  --primaer: #82d2c8; --auf-primaer: #00312d; --primaer-ton: #1b3d39; --auf-primaer-ton: #c4ede7;
  --warn: #ffb599; --warn-ton: #4a2616; --bald: #ecc76b; --bald-ton: #3b3013;
  --gut: #9fd6a3; --gut-ton: #1d3620; --tot: #ffb4ab; --tot-ton: #4b1d19;
  --ich: 201 164 120; --info: #a9c7ff; --info-ton: #1d3050; --lila: #d2bcff; --lila-ton: #33284a;
  --code: #1f2524; --markiert: #5a4d10;
  color-scheme: dark;
}
:root[data-thema="hell"] { color-scheme: light; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--grund); color: var(--text); font: var(--t-3)/1.55 var(--schrift); }
a { color: var(--primaer); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--primaer); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 0; }
code { font-family: var(--mono); font-size: .9em; }
.stumm { color: var(--text-3); }
.klein { font-size: var(--t-2); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.sym { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sprung { position: fixed; left: var(--a-2); top: -48px; z-index: 40; background: var(--primaer); color: var(--auf-primaer); padding: 8px 14px; border-radius: var(--r-1); font-weight: 600; }
.sprung:focus { top: var(--a-2); }

/* Seitenleiste: einzige Hauptnavigation */
.seitenleiste { position: fixed; inset: 0 auto 0 0; width: var(--leiste); z-index: 20; display: flex; flex-direction: column; background: var(--flaeche-2); border-right: 1px solid var(--linie); }
.marke { display: block; padding: var(--a-4) var(--a-4) var(--a-2); color: var(--text); }
.marke:hover { text-decoration: none; }
.marke #vault-name { display: block; font-weight: 700; font-size: var(--t-4); line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.marke small { display: block; font-size: var(--t-1); color: var(--text-2); font-variant-numeric: tabular-nums; }
.suchfeld { position: relative; margin: var(--a-2) var(--a-3) var(--a-1); }
.suchfeld .sym { position: absolute; left: 10px; top: 9px; color: var(--text-2); pointer-events: none; }
.suchfeld input { width: 100%; font: inherit; font-size: var(--t-2); color: var(--text); background: var(--flaeche); border: 1px solid var(--linie-2); border-radius: var(--r-2); padding: 6px 30px 6px 32px; height: 34px; }
.suchfeld input::placeholder { color: var(--text-3); }
.suchfeld kbd { position: absolute; right: 8px; top: 7px; font: 11px/18px var(--mono); color: var(--text-2); border: 1px solid var(--linie-2); border-radius: 4px; padding: 0 5px; pointer-events: none; }
.suchfeld input:focus + kbd { display: none; }
.suchliste { position: absolute; left: 0; top: 40px; width: min(460px, calc(100vw - 2 * var(--a-3))); z-index: 30; margin: 0; padding: var(--a-1); list-style: none; background: var(--flaeche); border: 1px solid var(--linie-2); border-radius: var(--r-2); box-shadow: 0 8px 24px rgb(0 0 0 / .18); max-height: min(70vh, 520px); overflow-y: auto; }
.suchliste li { padding: 6px 10px; border-radius: var(--r-1); cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 var(--a-2); align-items: baseline; }
.suchliste li[aria-selected="true"] { background: var(--primaer-ton); color: var(--auf-primaer-ton); }
.suchliste .st { font-size: var(--t-2); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suchliste .sp { grid-column: 1 / -1; font-size: var(--t-1); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suchliste li[aria-selected="true"] .sp { color: inherit; }
.suchliste .sz { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; }
.suchliste li.leer { cursor: default; color: var(--text-2); font-size: var(--t-2); display: block; }
.suchliste li.voll { border-top: 1px solid var(--linie); border-radius: 0 0 var(--r-1) var(--r-1); margin-top: var(--a-1); }

.navi { flex: 1 1 auto; overflow-y: auto; padding: 0 0 var(--a-3); min-height: 0; }
.navi h2 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); padding: 12px var(--a-4) 2px 20px; }
.navi ul { list-style: none; margin: 0; padding: 0; }
.navi li { position: relative; }
.navi a { display: flex; align-items: center; gap: 10px; min-height: 30px; padding: 3px 10px 3px 12px; margin: 1px var(--a-2); border-radius: var(--r-1); color: var(--text-2); font-size: 14px; font-weight: 550; line-height: 1.3; }
.navi a:hover { background: var(--flaeche-3); color: var(--text); text-decoration: none; }
.navi a.pfad { color: var(--text); }
.navi a.pfad .sym { color: var(--primaer); }
.navi a[aria-current="page"] { background: var(--primaer-ton); color: var(--auf-primaer-ton); font-weight: 650; }
.navi .nav-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navi .hat-klapp > a { padding-right: 34px; }
.nav-klapp { position: absolute; right: 12px; top: 4px; width: 24px; height: 24px; border: 0; background: transparent; color: var(--text-2); border-radius: var(--r-1); cursor: pointer; display: grid; place-items: center; padding: 0; }
.nav-klapp:hover { background: var(--flaeche-3); color: var(--text); }
.nav-klapp .sym { width: 14px; height: 14px; transition: transform .15s; }
.nav-klapp[aria-expanded="true"] .sym { transform: rotate(90deg); }
.navi .unter { margin: 0 0 var(--a-1) 27px; border-left: 1px solid var(--linie-2); }
.navi .unter a { min-height: 26px; font-size: var(--t-2); font-weight: 500; margin-left: 6px; padding-left: 10px; }
.navi .unter a.neben { color: var(--text-2); font-style: italic; }
.badge { flex: none; min-width: 22px; padding: 0 7px; border-radius: var(--r-voll); background: var(--flaeche-3); color: var(--text-2); font-size: var(--t-1); font-weight: 600; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums; font-style: normal; }
.navi a[aria-current="page"] .badge.neutral { background: color-mix(in srgb, var(--auf-primaer-ton) 14%, transparent); color: inherit; }
.badge.rot { background: var(--tot); color: var(--flaeche); font-weight: 700; }
.badge.bern { background: var(--bald-ton); color: var(--bald); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bald) 35%, transparent); }
.badge.gut { background: var(--gut-ton); color: var(--gut); }
.badges { display: inline-flex; gap: 3px; flex: none; }
.navi .nav-leer { margin: var(--a-4); font-size: var(--t-2); color: var(--text-2); }

.leiste-fuss { flex: none; border-top: 1px solid var(--linie); padding: var(--a-2); }
.fuss-reihe { display: flex; flex-wrap: wrap; align-items: center; gap: 0 2px; }
.leiste-fuss button { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: var(--t-2); font-weight: 550; color: var(--text-2); background: transparent; border: 0; border-radius: var(--r-1); padding: 4px 8px; min-height: 30px; cursor: pointer; text-align: left; white-space: nowrap; }
.leiste-fuss button:hover { background: var(--flaeche-3); color: var(--text); }
.lesezeit { display: block; font-size: var(--t-1); color: var(--text-2); padding: 2px 8px 2px; font-variant-numeric: tabular-nums; }
.lesezeit:empty { display: none; }

.kopfzeile { display: none; position: sticky; top: 0; z-index: 15; height: 48px; align-items: center; gap: var(--a-2); padding: 0 var(--a-3); background: var(--flaeche-2); border-bottom: 1px solid var(--linie); }
.kopfzeile button { width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: transparent; color: var(--text); border-radius: var(--r-1); cursor: pointer; }
.kopfzeile button .sym { width: 20px; height: 20px; }
.kopfzeile .kopf-titel { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.schleier { position: fixed; inset: 0; z-index: 18; background: rgb(0 0 0 / .4); }

main { margin-left: var(--leiste); padding: var(--a-5) var(--a-6) 64px; min-width: 0; }
main:focus { outline: none; }
.seite { max-width: var(--breite); }

/* Knöpfe */
.knopf { font: inherit; font-size: var(--t-2); font-weight: 600; border: 1px solid var(--linie-2); background: var(--flaeche); color: var(--text); padding: 6px 12px; border-radius: var(--r-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; line-height: 1.3; white-space: nowrap; }
.knopf:hover { background: var(--flaeche-2); text-decoration: none; }
.knopf.primaer { background: var(--primaer); color: var(--auf-primaer); border-color: var(--primaer); }
.knopf.primaer:hover { filter: brightness(1.08); }
.knopf.ton { background: var(--primaer-ton); color: var(--auf-primaer-ton); border-color: transparent; }
.knopf.gross { font-size: var(--t-3); padding: 11px 22px; }

/* Start */
.start { max-width: 600px; margin: 10vh auto 0; background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r-3); padding: var(--a-6); }
.start h1 { font-size: var(--t-6); margin-bottom: var(--a-3); }
.start .satz { font-size: var(--t-4); color: var(--text-2); margin: 0 0 var(--a-5); }
.start .knoepfe { display: flex; flex-wrap: wrap; gap: var(--a-3); margin-bottom: var(--a-5); }
.start .zusicherung { font-weight: 600; margin: 0 0 var(--a-2); }
.start .hinweis { color: var(--text-2); font-size: var(--t-2); margin: 0 0 var(--a-2); }
.start .fehler { color: var(--tot); }
.start.nur-text { background: none; border: 0; }
.laden { color: var(--text-2); }

/* Seitenkopf: auf jeder Seite gleich */
.seitenkopf { display: flex; flex-wrap: wrap; gap: var(--a-3) var(--a-5); align-items: flex-end; justify-content: space-between; margin: 0 0 var(--a-4); }
.seitenkopf h1 { font-size: 24px; font-weight: 700; display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--a-2) var(--a-3); overflow-wrap: anywhere; }
.seitenkopf .treffer { font-size: var(--t-2); font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; }
.seitenkopf .unterzeile { margin: 4px 0 0; color: var(--text-2); font-size: var(--t-2); max-width: var(--lese); }
.seitenkopf .aktionen { display: flex; gap: var(--a-2); flex-wrap: wrap; }
.brotkrumen { font-size: var(--t-2); color: var(--text-2); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; }
.brotkrumen a { color: var(--text-2); }
.brotkrumen .tr { color: var(--text-3); }
.brotkrumen b { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }
.meldung { margin: 0 0 var(--a-4); padding: var(--a-3) var(--a-4); border-radius: var(--r-2); background: var(--tot-ton); color: var(--text); border: 1px solid color-mix(in srgb, var(--tot) 40%, transparent); font-size: var(--t-2); }
.meldung b { color: var(--tot); }
.vorbehalt { margin: 0 0 var(--a-4); color: var(--text-2); font-size: var(--t-2); max-width: var(--lese); }

/* Status-Kennzahlen */
.status { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--a-3); margin: 0 0 var(--a-4); padding: 0; list-style: none; }
.status.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.status a, .status .karte { display: block; height: 100%; background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r-3); padding: var(--a-3) var(--a-4); color: var(--text); position: relative; overflow: hidden; }
.status a:hover { text-decoration: none; border-color: var(--linie-2); background: var(--flaeche-2); }
.status .sl { font-size: var(--t-1); font-weight: 650; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
.status .sl i { width: 8px; height: 8px; border-radius: 50%; background: var(--linie-2); flex: none; }
.status .sw { font-size: 30px; line-height: 1.2; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; display: block; }
.status .sw .trenner { color: var(--text-3); font-weight: 400; }
.status .su { display: block; font-size: var(--t-1); color: var(--text-2); font-variant-numeric: tabular-nums; }
.status .rot { border-color: color-mix(in srgb, var(--tot) 55%, var(--linie)); }
.status .rot::before, .status .bern::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--tot); }
.status .bern::before { background: var(--bald); }
.status .rot .sw, .status .rot .sl { color: var(--tot); }
.status .rot .sl i { background: var(--tot); }
.status .bern .sw { color: var(--bald); }
.status .bern .sl i { background: var(--bald); }
.status .gut .sl i { background: var(--gut); }
.status .sw .t-rot { color: var(--tot); } .status .sw .t-bern { color: var(--bald); } .status .sw .t-neutral { color: var(--text); }

/* Lagebild: zwei Spalten, Blöcke */
.spalten { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--a-4); align-items: start; }
.spalte { display: flex; flex-direction: column; gap: var(--a-4); min-width: 0; }
.block, .kachel { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r-3); min-width: 0; }
.block-kopf { display: flex; align-items: baseline; gap: var(--a-2); padding: var(--a-3) var(--a-4) 0; }
.block-kopf h2 { font-size: var(--t-3); font-weight: 650; }
.block-kopf .mehr { margin-left: auto; font-size: var(--t-2); font-weight: 600; white-space: nowrap; }
.block-inhalt { padding: var(--a-2) var(--a-4) var(--a-3); }
.block.einzeilig { display: flex; align-items: baseline; gap: var(--a-2); padding: 10px var(--a-4); }
.block.einzeilig h2 { font-size: var(--t-3); font-weight: 650; }
.block.einzeilig p { margin: 0; color: var(--text-2); font-size: var(--t-2); }
.block.einzeilig .ok { color: var(--gut); font-weight: 700; }
.block.einzeilig .mehr { margin-left: auto; font-size: var(--t-2); font-weight: 600; white-space: nowrap; }
.zahl { display: inline-block; min-width: 22px; padding: 0 7px; border-radius: var(--r-voll); background: var(--flaeche-3); color: var(--text); font-size: var(--t-1); font-weight: 600; line-height: 20px; text-align: center; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.zahl.rot { background: var(--tot-ton); color: var(--tot); } .zahl.bern { background: var(--bald-ton); color: var(--bald); }
.naechster { background: var(--primaer-ton); color: var(--auf-primaer-ton); border-radius: var(--r-3); padding: var(--a-4) var(--a-5); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--a-1) var(--a-5); align-items: start; }
.naechster .etikett { color: inherit; }
.naechster .schritt { font-size: 19px; line-height: 1.4; font-weight: 600; margin: 4px 0 0; grid-column: 1 / -1; max-width: 62em; }
.naechster .schritt p { margin: 0 0 .4em; } .naechster .schritt p:last-child { margin: 0; }
.naechster .schritt code { background: color-mix(in srgb, var(--auf-primaer-ton) 10%, transparent); padding: .05em .3em; border-radius: 4px; }
.naechster a { color: inherit; text-decoration: underline; font-size: var(--t-2); font-weight: 600; white-space: nowrap; }
.etikett { font-size: var(--t-1); text-transform: uppercase; letter-spacing: .06em; font-weight: 650; color: var(--text-2); display: flex; align-items: center; gap: var(--a-2); }

/* Zeilenlisten: Zeitleiste, Aufgaben, Rückfragen */
.zeilen { list-style: none; margin: 0; padding: 0; }
.zeilen > li { display: grid; grid-template-columns: 104px minmax(0, 1fr) auto; gap: 2px var(--a-3); align-items: baseline; padding: 9px 0; border-top: 1px solid var(--linie); font-size: var(--t-2); }
.zeilen > li:first-child { border-top: 0; }
.zeilen > li > .chip { justify-self: start; }
.zeilen .zt { min-width: 0; overflow-wrap: anywhere; color: var(--text); font-size: 14px; }
.zeilen .zt p { margin: 0; }
.zeilen .zu { display: block; font-size: var(--t-1); color: var(--text-2); margin-top: 1px; }
.zeilen .zd { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--text-2); font-size: var(--t-1); }
.zeilen .zd b { display: block; font-size: var(--t-2); color: var(--text); font-weight: 600; }
.zeilen .zd.rot b { color: var(--tot); } .zeilen .zd.bern b { color: var(--bald); }
.zeilen .zl { grid-column: 2 / -1; font-size: var(--t-1); }
.zeilen.zeit > li { grid-template-columns: 92px 104px minmax(0, 1fr); }
.zeilen.zeit .zd { text-align: left; }
.gruppe-titel { display: flex; align-items: center; gap: var(--a-2); font-size: var(--t-1); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin: var(--a-3) 0 0; padding-bottom: 4px; border-bottom: 1px solid var(--linie-2); }
.gruppe-titel:first-child { margin-top: 0; }
.gruppe-titel.rot { color: var(--tot); border-color: var(--tot); }
.gruppe-titel.bern { color: var(--bald); }
.leer { margin: 0; color: var(--text-2); font-size: var(--t-2); }
.leer .ok { color: var(--gut); font-weight: 700; }
.leer-karte { background: var(--flaeche); border: 1px dashed var(--linie-2); border-radius: var(--r-3); padding: var(--a-5); color: var(--text-2); font-size: 14px; max-width: var(--lese); }
.leer-karte b { color: var(--text); display: block; margin-bottom: 4px; font-size: var(--t-3); }
details.klapp > summary { cursor: pointer; font-size: var(--t-2); font-weight: 600; color: var(--text-2); padding: 6px 0; }
details.klapp > summary:hover { color: var(--text); }

.eintraege { list-style: none; margin: 0; padding: 0; }
.eintraege li { padding: 7px 0; border-top: 1px solid var(--linie); display: flex; gap: var(--a-3); align-items: baseline; justify-content: space-between; min-width: 0; font-size: 14px; }
.eintraege li:first-child { border-top: 0; padding-top: 2px; }
.eintraege .haupt { min-width: 0; overflow-wrap: anywhere; }
.eintraege .neben { flex: none; font-size: var(--t-1); color: var(--text-2); text-align: right; font-variant-numeric: tabular-nums; }
.eintraege .unter { display: block; font-size: var(--t-1); color: var(--text-2); }
.eintraege .unter.fehler { color: var(--tot); }
.eintraege.zeilig li { display: block; font-size: var(--t-2); }
.frist.faellig { color: var(--tot); font-weight: 600; }
.frist.bald { color: var(--bald); font-weight: 600; }
.balken { height: 6px; background: var(--flaeche-3); border-radius: 3px; margin-top: 5px; overflow: hidden; display: flex; }
.balken span { display: block; height: 100%; background: var(--primaer); }
.balken span.rest { background: color-mix(in srgb, var(--primaer) 38%, var(--flaeche-3)); }
.typen { font-size: var(--t-1); color: var(--text-2); }
.bereich-zeile { padding: 9px 0; border-top: 1px solid var(--linie); font-size: 14px; }
.bereich-zeile:first-child { border-top: 0; padding-top: 2px; }
.bereich-zeile .bz { display: flex; justify-content: space-between; gap: var(--a-2); align-items: baseline; }
.bereich-zeile .bz a { font-weight: 600; }
.bereich-zeile .bn { font-size: var(--t-1); color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bereich-zeile .stapel { height: 6px; margin-top: 5px; }
.fortschritt { display: flex; align-items: center; gap: var(--a-3); font-size: var(--t-2); color: var(--text-2); font-variant-numeric: tabular-nums; }
.fortschritt .stapel { flex: 1; }

/* Auswertung und Kacheln */
.raster { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--a-4); align-items: stretch; }
.raster .breit { grid-column: 1 / -1; }
.kachel { padding: var(--a-4) var(--a-4) var(--a-3); display: flex; flex-direction: column; }
.kachel-kopf { margin-bottom: var(--a-3); }
.kachel-label { font-size: var(--t-1); text-transform: uppercase; letter-spacing: .06em; font-weight: 650; color: var(--text-2); display: flex; align-items: center; gap: var(--a-2); }
.kachel-frage { font-size: var(--t-3); font-weight: 650; margin-top: 4px; color: var(--text); }
.kachel.warn { border-color: color-mix(in srgb, var(--warn) 60%, var(--linie)); }
.kachel.warn .kachel-label { color: var(--warn); }
.kachel.warn .zahl { background: var(--warn-ton); color: var(--warn); }
.kachel > .gezaehlt { margin-top: auto; padding-top: var(--a-3); }
.kachel summary { cursor: pointer; font-size: var(--t-2); font-weight: 600; color: var(--text-2); }
.gezaehlt { margin: var(--a-3) 0 0; font-size: var(--t-1); color: var(--text-2); }
.kreuz { width: 100%; border-collapse: collapse; font-size: var(--t-2); font-variant-numeric: tabular-nums; }
.kreuz th, .kreuz td { padding: 6px 8px; text-align: right; border-top: 1px solid var(--linie); }
.kreuz th:first-child, .kreuz td:first-child { text-align: left; }
.kreuz thead th { border-top: 0; color: var(--text-2); font-weight: 600; font-size: var(--t-1); }
.kreuz tfoot td { font-weight: 650; }
.kreuz td.zelle a { display: block; color: var(--text); border-radius: var(--r-1); padding: 2px 6px; }
.kreuz td.null { color: var(--text-3); }
.stapel { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--flaeche-3); }
.stapel span { display: block; height: 100%; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: var(--a-2) 0 0; padding: 0; list-style: none; font-size: var(--t-1); color: var(--text-2); }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.diagramm { max-width: 100%; height: auto; display: block; overflow: visible; }
.diagramm text { font-size: 10px; fill: var(--text-2); font-family: var(--schrift); }
.kennzahlen { display: flex; flex-wrap: wrap; gap: var(--a-2); margin: 0; }
.kennzahlen div { background: var(--flaeche-2); border-radius: var(--r-2); padding: 8px 14px; min-width: 96px; }
.kennzahlen dt { font-size: var(--t-1); color: var(--text-2); }
.kennzahlen dd { margin: 0; font-size: var(--t-5); font-weight: 650; font-variant-numeric: tabular-nums; }

/* Prüfung */
.sprungmarken { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 var(--a-4); align-items: center; }
.sprungmarken .sm-titel { font-size: var(--t-1); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin-right: 4px; }
.pille { font: inherit; font-size: var(--t-2); font-weight: 550; display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 11px; border-radius: var(--r-voll); border: 1px solid var(--linie-2); background: var(--flaeche); color: var(--text); cursor: pointer; line-height: 1.4; white-space: nowrap; }
.pille:hover { background: var(--flaeche-2); text-decoration: none; }
.pille .zahl { min-width: 20px; }
.pille.ohne { padding-right: 11px; }
.pille[aria-pressed="true"], .pille[aria-current="true"] { background: var(--primaer-ton); border-color: transparent; color: var(--auf-primaer-ton); font-weight: 650; }
.pille[aria-current="true"] .zahl { background: color-mix(in srgb, var(--auf-primaer-ton) 14%, transparent); color: inherit; }
.stufe { margin-bottom: var(--a-4); }
.stufe-kopf { display: flex; align-items: baseline; gap: var(--a-2); margin: 0 0 var(--a-2); }
.stufe-kopf h2 { font-size: var(--t-4); font-weight: 650; }
.stufe-kopf p { margin: 0; color: var(--text-2); font-size: var(--t-2); }
.kopierblock { font-family: var(--mono); font-size: var(--t-1); line-height: 1.6; background: var(--code); border: 1px solid var(--linie); padding: var(--a-3) var(--a-4); border-radius: var(--r-2); overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: var(--a-2) 0 0; -webkit-user-select: all; user-select: all; }
.bericht-text summary { cursor: pointer; font-weight: 600; font-size: var(--t-2); color: var(--text-2); }
.bericht-text pre { font-family: var(--mono); font-size: var(--t-1); line-height: 1.5; background: var(--code); padding: var(--a-3) var(--a-4); border-radius: var(--r-2); overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Listen */
.werkzeug { display: flex; flex-wrap: wrap; gap: var(--a-2); align-items: center; margin-bottom: var(--a-2); }
.werkzeug input[type="search"] { flex: 1 1 260px; min-width: 200px; max-width: 420px; }
.werkzeug input, .werkzeug select { font: inherit; font-size: var(--t-2); color: var(--text); background: var(--flaeche); border: 1px solid var(--linie-2); border-radius: var(--r-2); padding: 6px 10px; height: 34px; }
.werkzeug select { max-width: 190px; }
.werkzeug select.aktiv { border-color: var(--primaer); background: var(--primaer-ton); color: var(--auf-primaer-ton); font-weight: 600; }
.werkzeug .rechts { margin-left: auto; }
.filterchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: var(--a-3); }
.filterchips .fc-titel { font-size: var(--t-1); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin-right: 2px; }
.filterchips .fc-titel:not(:first-child) { margin-left: var(--a-3); }
.tabelle-rahmen { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r-3); overflow: clip; }
table.liste { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--t-2); }
table.liste th { position: sticky; top: 0; z-index: 2; background: var(--flaeche-2); text-align: left; font-weight: 650; color: var(--text-2); font-size: var(--t-1); text-transform: uppercase; letter-spacing: .04em; padding: 8px 12px; border-bottom: 1px solid var(--linie); white-space: nowrap; }
table.liste td { padding: 7px 12px; border-top: 1px solid var(--linie); vertical-align: top; }
table.liste tbody tr:first-child td { border-top: 0; }
table.liste tbody tr[data-href] { cursor: pointer; }
table.liste tbody tr[data-href]:hover { background: var(--flaeche-2); }
table.liste .titel { font-weight: 600; font-size: 14px; }
table.liste .pfad { font-size: var(--t-1); color: var(--text-2); overflow-wrap: anywhere; }
table.liste .ausschnitt { font-size: var(--t-1); color: var(--text-2); margin-top: 2px; }
table.liste .zahlspalte { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.liste th.zahlspalte { text-align: right; }
table.liste .gruppe td { background: var(--flaeche-2); font-weight: 650; cursor: default; }
table.liste .gruppe.stufe-punkt td { scroll-margin-top: 48px; }
table.liste td.eintrag { font-size: 14px; max-width: 72ch; }
table.liste td.eintrag .zu { display: block; font-size: var(--t-1); color: var(--text-2); margin-top: 2px; }
table.liste.pruef td:first-child { width: 34%; min-width: 220px; }
table.liste td.befund { color: var(--text); overflow-wrap: anywhere; }
table.liste .stumm { color: var(--text-3); }
.mehr-zeilen { display: flex; flex-wrap: wrap; align-items: center; gap: var(--a-2); margin: var(--a-3) 0 0; font-size: var(--t-2); color: var(--text-2); }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-1); line-height: 1.5; padding: 1px 8px; border-radius: var(--r-voll); background: var(--flaeche-3); color: var(--text-2); border: 1px solid transparent; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.chip b { font-weight: 650; color: var(--text); }
.chip.typ, .chip.t-begriff { background: var(--primaer-ton); color: var(--auf-primaer-ton); }
.chip.t-quelle, .chip.s-mittel, .chip.a-pruefdatum { background: var(--info-ton); color: var(--info); }
.chip.t-bruecke, .chip.t-projekt, .chip.a-vorgemerkt { background: var(--lila-ton); color: var(--lila); }
.chip.t-notiz, .chip.ich { background: rgb(var(--ich) / .16); color: color-mix(in srgb, rgb(var(--ich)) 80%, var(--text)); }
.chip.t-akteur, .chip.s-hoch, .chip.gut, .chip.a-entschieden { background: var(--gut-ton); color: var(--gut); }
.chip.warn, .chip.faellig, .chip.strittig, .chip.s-strittig, .chip.a-widerspruch { background: var(--warn-ton); color: var(--warn); }
.chip.bald, .chip.s-niedrig, .chip.a-rueckfrage, .chip.a-frist { background: var(--bald-ton); color: var(--bald); }
.chip.gedaempft { background: transparent; border-color: var(--linie-2); font-weight: 500; }
.chip.fehler, .chip.a-muss { background: var(--tot-ton); color: var(--tot); }
.chip.tag { background: transparent; border-color: var(--linie-2); font-weight: 500; }

/* Dokument */
.dok { display: grid; grid-template-columns: minmax(0, var(--lese)) minmax(260px, 320px); grid-template-rows: auto auto 1fr; gap: var(--a-3) 48px; align-items: start; max-width: 1140px; }
.dok-kopf { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--a-2) var(--a-4); align-items: center; justify-content: space-between; }
.dok-kopf .brotkrumen { margin: 0; }
.dok-kopf .aktionen { display: flex; gap: var(--a-2); flex-wrap: wrap; }
.dok-haupt { grid-column: 1; grid-row: 2; min-width: 0; }
.dok-text { grid-column: 1; grid-row: 3; min-width: 0; }
.dok-titel { font-size: 30px; font-weight: 700; margin: var(--a-2) 0 var(--a-3); overflow-wrap: anywhere; }
.dok-haupt > .chips { margin-bottom: var(--a-2); }
.fm-fehler { margin: 0 0 var(--a-4); background: var(--tot-ton); color: var(--tot); border-radius: var(--r-2); padding: var(--a-3) var(--a-4); font-size: var(--t-2); }
.fm-fehler pre { color: var(--text); background: var(--flaeche); margin: var(--a-2) 0 0; padding: var(--a-2); border-radius: var(--r-1); overflow-x: auto; }
.info { grid-column: 2; grid-row: 2 / span 2; position: sticky; top: var(--a-4); max-height: calc(100vh - 2 * var(--a-4)); overflow-y: auto; font-size: var(--t-2); background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r-3); }
.info summary { cursor: pointer; font-weight: 650; padding: 10px var(--a-4); display: none; }
.info-block { padding: var(--a-3) var(--a-4); border-top: 1px solid var(--linie); }
.info summary + .info-block { border-top: 0; }
.info details:not([open]) > summary { color: var(--text-2); }
.info-block h2 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); margin-bottom: var(--a-2); display: flex; gap: var(--a-2); align-items: center; }
.info-block dl { margin: 0; display: grid; grid-template-columns: minmax(84px, max-content) minmax(0, 1fr); gap: 5px var(--a-3); align-items: baseline; }
.info-block dt { color: var(--text-2); }
.info-block dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.info-block dd.lang, .info-block dt.lang { grid-column: 1 / -1; }
.info-block dd.lang { margin: -3px 0 4px; color: var(--text); }
.info-block dd ul, .info-block ul, .info-block ol { list-style: none; margin: 0; padding: 0; }
.info-block li { padding: 3px 0; overflow-wrap: anywhere; }
.info-block li.e3 { padding-left: 12px; } .info-block li.e4 { padding-left: 24px; }
.info-block .art { display: block; font-size: var(--t-1); color: var(--text-2); }
.info-block .befund { border-left: 3px solid var(--linie-2); padding: 2px 0 2px 10px; margin: 6px 0; }
.info-block .befund.muss { border-color: var(--tot); } .info-block .befund.sollte { border-color: var(--bald); }
.info-block .befund b { display: block; font-size: var(--t-1); }
.anhang-karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r-3); padding: var(--a-5); max-width: var(--lese); }
.anhang-karte p { margin: 0 0 var(--a-3); }

/* Markdown */
.md { font-size: 16px; line-height: 1.65; overflow-wrap: break-word; min-width: 0; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1.6em 0 .5em; scroll-margin-top: 64px; }
.md h1 { font-size: 26px; } .md h2 { font-size: 21px; } .md h3 { font-size: 18px; } .md h4, .md h5, .md h6 { font-size: 16px; }
.md p { margin: .7em 0; }
.md ul, .md ol { padding-left: 1.5em; margin: .6em 0; }
.md li { margin: .2em 0; }
.md li > ul, .md li > ol { margin: .2em 0; }
.md li.aufgabe { list-style: none; margin-left: -1.4em; }
.md li.aufgabe input { margin: 0 .45em 0 0; vertical-align: -1px; }
.md li.erledigt { color: var(--text-3); }
.md code, .zeilen code, .eintrag code, .naechster code { font-family: var(--mono); font-size: .88em; }
.md code, .zeilen code, .eintrag code { background: var(--code); padding: .1em .35em; border-radius: 4px; }
.md pre { background: var(--code); padding: var(--a-3) var(--a-4); border-radius: var(--r-2); overflow-x: auto; font-size: 13.5px; line-height: 1.5; }
.md pre code { background: none; padding: 0; font-size: inherit; }
.md blockquote { margin: 1em 0; padding: .1em 1em; border-left: 3px solid var(--linie-2); color: var(--text-2); }
.md hr { border: 0; border-top: 1px solid var(--linie); margin: 1.6em 0; }
.md mark { background: var(--markiert); color: inherit; padding: 0 2px; }
.md img { max-width: 100%; height: auto; border-radius: var(--r-1); }
.md .tabelle { overflow-x: auto; margin: 1em 0; }
.md table { border-collapse: collapse; font-size: 14px; }
.md th, .md td { border: 1px solid var(--linie); padding: 6px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--flaeche-2); font-weight: 600; }
.md .tag { color: var(--auf-primaer-ton); background: var(--primaer-ton); padding: 0 6px; border-radius: var(--r-voll); font-size: .88em; }
.md a.extern::after { content: " ↗"; font-size: .8em; }
.link-tot { color: var(--tot); text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
a.mehrdeutig { text-decoration: underline dotted; }
.einbettung { display: inline-block; padding: 2px 8px; border: 1px dashed var(--linie-2); border-radius: var(--r-1); font-size: .92em; }
.callout { --c: var(--info); --c-ton: var(--info-ton); margin: 1em 0; border-radius: var(--r-2); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); background: var(--c-ton); padding: .6em 1em; color: var(--text); }
.callout > .callout-titel, .callout > summary { font-weight: 650; color: var(--c); display: flex; gap: 6px; align-items: center; }
.callout > summary { cursor: pointer; }
.callout-inhalt > :first-child { margin-top: .3em; } .callout-inhalt > :last-child { margin-bottom: .2em; }
.callout[data-farbe="tip"] { --c: var(--gut); --c-ton: var(--gut-ton); }
.callout[data-farbe="warning"] { --c: var(--bald); --c-ton: var(--bald-ton); }
.callout[data-farbe="danger"] { --c: var(--tot); --c-ton: var(--tot-ton); }
.callout[data-farbe="example"] { --c: var(--lila); --c-ton: var(--lila-ton); }
.callout[data-farbe="quote"] { --c: var(--text-2); --c-ton: var(--flaeche-2); }
.callout[data-farbe="ich"] { --c: rgb(var(--ich)); --c-ton: rgb(var(--ich) / .09); border-color: rgb(var(--ich) / .35); border-left: 4px solid rgb(var(--ich)); }
.callout[data-farbe="ich"] .callout-inhalt { font-style: normal; }
.callout svg { width: 16px; height: 16px; flex: none; }

@media (max-width: 1240px) {
  .spalten { grid-template-columns: minmax(0, 1fr) 300px; }
}
@media (max-width: 1099px) {
  .dok { grid-template-columns: minmax(0, var(--lese)); grid-template-rows: none; }
  .dok-haupt, .dok-text { grid-row: auto; }
  .info { grid-column: 1; grid-row: auto; position: static; max-height: none; }
  .info summary { display: list-item; }
  .info details[open] > summary { border-bottom: 1px solid var(--linie); }
  .spalten { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .kopfzeile { display: flex; }
  .seitenleiste { transform: translateX(-100%); transition: transform .18s ease; width: min(288px, 86vw); visibility: hidden; }
  body.menue-offen .seitenleiste { transform: none; visibility: visible; box-shadow: 0 0 32px rgb(0 0 0 / .3); }
  main { margin-left: 0; padding: var(--a-4) var(--a-4) 48px; }
  .tabelle-rahmen { overflow-x: auto; }
  table.liste th { position: static; }
  table.liste { min-width: 640px; }
  .raster { grid-template-columns: minmax(0, 1fr); }
  .suchfeld kbd { display: none; }
}
@media (max-width: 760px) {
  .status { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 600px) {
  .status.n3 { grid-template-columns: minmax(0, 1fr); }
  main { padding: var(--a-3) var(--a-3) 48px; }
  .seitenkopf h1 { font-size: 21px; } .dok-titel { font-size: 24px; }
  .status { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--a-2); }
  .status .sw { font-size: 24px; }
  .zeilen > li, .zeilen.zeit > li { grid-template-columns: minmax(0, 1fr) auto; }
  .zeilen > li > .chip { grid-column: 1 / -1; justify-self: start; }

        (be.traeger.length ? '<h3 style="font-size:var(--t-2);margin:14px 0 4px">Quellen, die am meisten tragen</h3><ul class="eintraege">' + be.traeger.slice(0, 6).map(function (t) {
          var d = idx.nachPfad[t.pfad];
          return '<li><span class="haupt">' + (d ? docLink(d, t.titel) : esc(t.titel)) + '</span><span class="neben">' + seitenZahl(t.seiten) + (t.allein ? ', ' + t.allein + ' nur auf ihr' : '') + '</span></li>';
        }).join('') + '</ul>' : '') +
        (be.eine.length ? '<details style="margin-top:8px"><summary>Seiten an einer einzigen Quelle · ' + be.eine.length + '</summary><ul class="eintraege zeilig">' + be.eine.map(function (x) { return '<li>' + docLink(idx.nachPfad[x.pfad], x.titel) + ' <span class="typen">' + esc(x.bereich) + '</span></li>'; }).join('') + '</ul></details>' : '') +
        (be.ohne.length ? '<details style="margin-top:8px"><summary>Seiten ohne Beleg · ' + be.ohne.length + '</summary><ul class="eintraege zeilig">' + be.ohne.map(function (x) { return '<li>' + docLink(idx.nachPfad[x.pfad], x.titel) + ' <span class="typen">' + esc(x.bereich) + '</span></li>'; }).join('') + '</ul></details>' : '');
    }
    h += kachel({ label: 'Belege', zahl: be.seiten || null, frage: 'Worauf ruht mein Wissen?', inhalt: beInhalt,
      leer: 'Noch keine Begriffs- oder Akteursseiten.',
      fuss: gezaehlt('je <code>begriff</code>- und <code>akteur</code>-Seite die verlinkten <code>quelle</code>-Seiten (auch unter Verbindungen), die Dateien in <code>quellen:</code> und Links in ein Modul; ohne veraltete Seiten. Brücken, Projekte und Notizen stützen sich auf andere Seiten und zählen nicht. Mehrere Belege sind kein Urteil über ihre Güte.') });

    // Beleglage
    h += kachel({ klasse: 'breit', label: 'Sicherheit', zahl: a.beleglage.summe.gesamt || null, frage: 'Wo ist mein Wissen gut belegt, wo dünn?',
      inhalt: a.beleglage.summe.gesamt ? kreuzTabelle(a.beleglage, { ohne: 'ohne gültige Angabe' }, '') +
        (a.beleglage.ohneBereich ? '<p class="leer" style="margin-top:8px">' + a.beleglage.ohneBereich + ' Seiten liegen direkt in <code>wiki/</code> und gehören zu keinem Bereich; sie fehlen hier.</p>' : '') : '',
      leer: 'Noch keine Seiten in Bereichen.',
      fuss: gezaehlt('<code>sicherheit:</code> der Seiten in Bereichsordnern, ohne Meta-Seiten und ohne veraltete oder ersetzte Seiten. Notizen haben kein Feld und stehen unter „ohne gültige Angabe“, ebenso unbekannte Werte. Farbe = Anteil im Bereich.') });

    // Verlauf
    var v = a.verlauf, vInhalt = '';
    if (v.monate.length) {
      var farbeVon = function (vg) { return REIHE[v.vorgaenge.indexOf(vg) % REIHE.length]; };
      vInhalt = '<h3 style="font-size:var(--t-2);margin:0 0 4px">Vorgänge im Protokoll · ' + v.eintraege + '</h3>' +
        saeulen(v.monate.map(function (m) { return { label: monatKurz(m.monat), teile: v.vorgaenge.map(function (vg) { return { wert: m.vorgaenge[vg] || 0, farbe: farbeVon(vg), titel: vg }; }) }; }), 'Vorgänge je Monat') +
        legende(v.vorgaenge.map(function (vg) { return { name: vg, farbe: farbeVon(vg) }; })) +
        '<h3 style="font-size:var(--t-2);margin:16px 0 4px">Angelegte Seiten · ' + v.angelegt + '</h3>' +
        saeulen(v.monate.map(function (m) { return { label: monatKurz(m.monat), teile: [{ wert: m.angelegt, farbe: '--primaer', titel: 'angelegt' }] }; }), 'Angelegte Seiten je Monat');
    }
    h += kachel({ klasse: 'breit', label: 'Verlauf', frage: 'Wann ist was dazugekommen?', inhalt: vInhalt, leer: 'Noch keine Einträge im Protokoll und keine Seiten mit <code>created:</code>.',
      fuss: gezaehlt('Überschriften <code>## [Datum] vorgang</code> in <code>wiki/log.md</code> und <code>created:</code> der Seiten in Bereichen, je Monat, höchstens 24 Monate bis heute.' +
        (v.unbrauchbar ? ' ' + v.unbrauchbar + ' Einträge im Protokoll mit ungültigem Datum oder Datum nach heute sind nicht dabei.' : '')) });

    // Fristen
    var fr = a.fristen, frSumme = fr.monate.reduce(function (n, m) { return n + m.eintraege.length; }, 0);
    var frInhalt = (fr.abgelaufen.length ? '<p class="leer" style="margin:0 0 8px"><span class="frist faellig">' + fr.abgelaufen.length + ' schon abgelaufen</span>, siehe <a href="#heute">Heute zu tun</a>.</p>' : '') +
      (frSumme ? saeulen(fr.monate.map(function (m) { return { label: monatKurz(m.monat), teile: [{ wert: m.eintraege.length, farbe: '--bald', titel: m.eintraege.map(function (e) { return e.titel; }).join(', ') }] }; }), 'Ablaufende Prüfdaten je Monat') +
        '<ul class="eintraege" style="margin-top:10px">' + fr.monate.reduce(function (l, m) { return l.concat(m.eintraege); }, []).slice(0, 6).map(function (e) {
          var d = idx.nachPfad[e.pfad]; return '<li><span class="haupt">' + (d ? docLink(d, e.titel) : esc(e.titel)) + ' <span class="typen">' + esc(e.art) + '</span></span><span class="neben">' + K.datumDe(e.datum) + '</span></li>';
        }).join('') + '</ul>' : '');
    h += kachel({ label: 'Fristen', zahl: frSumme || null, frage: 'Was läuft in den nächsten zwölf Monaten ab?', inhalt: frInhalt, klasse: fr.abgelaufen.length ? 'warn' : '',
      leer: 'In den nächsten zwölf Monaten läuft nichts ab.', fuss: gezaehlt('<code>pruefen_bis:</code> und <code>verfaellt:</code> in Wiki-Seiten, Leitplanken und Modulen; die Art steht neben dem Titel. Leitplanken und Module prüfen ihre Autorinnen und Autoren.') });

    // Stimme
    var st = a.stimmen, stInhalt = '';
    if (st.summe.gesamt) {
      var tn = ['ich', 'gemischt', 'agent', 'ohne'];
      stInhalt = '<ul class="eintraege">' + st.zeilen.map(function (z) {
        return '<li style="display:block"><span class="haupt">' + esc(z.name) + '</span> <span class="typen">' + seitenZahl(z.gesamt) + ': ' + z.ich + ' ganz, ' + z.gemischt + ' teils in deinen Worten</span><div class="stapel" style="margin-top:4px">' +
          tn.map(function (t) { return z[t] ? '<span title="' + esc(t + ': ' + z[t]) + '" style="width:' + (z[t] / z.gesamt * 100) + '%;background:' + farbe(FARBE[t]) + '"></span>' : ''; }).join('') + '</div></li>';
      }).join('') + '</ul>' + legende([{ name: 'ich', farbe: FARBE.ich }, { name: 'gemischt', farbe: FARBE.gemischt }, { name: 'agent', farbe: FARBE.agent }, { name: 'ohne Angabe', farbe: FARBE.ohne }]);
    }
    h += kachel({ label: 'Stimme', frage: 'Wie viel davon ist von mir?', inhalt: stInhalt, leer: 'Noch keine Seiten in Bereichen.',
      fuss: gezaehlt('<code>stimme:</code> der Seiten in Bereichen: <em>ich</em> = deine Notiz, <em>gemischt</em> = mit einem Block in deinen Worten.') });

    h += '</div></div>';
    haupt.innerHTML = h;
  }

  /* ---------- Prüfung ----------
     Zeigt K.pruefbericht: dieselben Befunde, die agent/werkzeug/pruefen.js als Text ausgibt. */
  var BEFUND_SCHRITT = 100;
  function zeigePruefung(offen) {
    offen = offen || {};
    setzeNavi('pruefung');
    var idx = S.idx, b = pruefung(), z = b.zahlen;
    var h = '<div class="seite">' + seitenkopf({ titel: 'Prüfung', treffer: mehrzahl(b.muss.length + b.sollte.length + b.kenntnis.length, 'Befund', 'Befunde'), unter: 'Stand beim Einlesen · heute ' + esc(K.wochentag(S.heute)) + ', ' + K.datumDe(S.heute) });
    var TEIL = { muss: ['rot', 'Hier ist etwas kaputt.', 'Kein Link führt ins Leere, kein Datum liegt in der Zukunft, jedes Frontmatter ist lesbar.'],
      sollte: ['bern', 'Hier weicht etwas von den Regeln ab, das Wiki funktioniert aber.', 'Nichts weicht von den Regeln ab.'], kenntnis: ['', 'Nichts zu tun, nur gut zu wissen.', 'Nichts zu melden.'] };
    h += '<ul class="status n3" aria-label="Befunde nach Stufe">' + K.PRUEF_ABSCHNITTE.map(function (s) {
      var n = b[s[0]].length;
      return '<li><a href="#pruefung" data-sprung="st-' + s[0] + '" class="' + (n ? TEIL[s[0]][0] : 'gut') + '"><span class="sl"><i></i>' + esc(s[1]) + '</span><span class="sw">' + n + '</span><span class="su">' + (n ? TEIL[s[0]][1] : '✓ ' + TEIL[s[0]][2]) + '</span></a></li>';
    }).join('') + '</ul>';
    h += '<p class="vorbehalt">Diese Seite prüft, was sich zählen und vergleichen lässt: Links, Felder, Daten, Protokoll, Übergabe. Ob eine Aussage stimmt und gut belegt ist, sieht sie nicht; das prüft dein Agent, wenn du „prüfen“ sagst. Beheben kann die Ansicht nichts, sie liest nur.</p>';
    // Je Stufe die Prüfpunkte in der Reihenfolge des Berichts
    var stufen = K.PRUEF_ABSCHNITTE.map(function (s) {
      var folge = [], nach = Object.create(null);
      b[s[0]].forEach(function (x) { if (!nach[x.punkt]) { nach[x.punkt] = []; folge.push(x.punkt); } nach[x.punkt].push(x); });
      return { id: s[0], titel: s[1], folge: folge, nach: nach, anzahl: b[s[0]].length };
    });
    var marken = stufen.map(function (s) {
      return s.folge.map(function (p, i) { return '<button type="button" class="pille" data-sprung="pp-' + s.id + '-' + i + '" title="' + esc(s.titel) + '">' + esc(p) + '<span class="zahl ' + TEIL[s.id][0] + '">' + s.nach[p].length + '</span></button>'; }).join('');
    }).join('');
    if (marken) h += '<div class="sprungmarken" role="group" aria-label="Zu einem Prüfpunkt springen"><span class="sm-titel">Prüfpunkte</span>' + marken + '</div>';
    stufen.forEach(function (s) {
      h += '<section class="stufe" id="st-' + s.id + '"><div class="stufe-kopf"><h2>' + esc(s.titel) + '</h2><span class="zahl ' + (s.anzahl ? TEIL[s.id][0] : '') + '">' + s.anzahl + '</span><p>' + (s.anzahl ? TEIL[s.id][1] : '') + '</p></div>';
      if (!s.anzahl) h += '<p class="leer"><span class="ok">✓</span> ' + TEIL[s.id][2] + '</p>';
      else h += tabelleHtml(['Datei', 'Befund'], s.folge.reduce(function (rows, p, i) {
        rows.push('<tr class="gruppe stufe-punkt"><td colspan="2" id="pp-' + s.id + '-' + i + '">' + esc(p) + ' <span class="zahl ' + TEIL[s.id][0] + '">' + s.nach[p].length + '</span></td></tr>');
        var schl = s.id + '-' + i, liste = offen[schl] ? s.nach[p] : s.nach[p].slice(0, BEFUND_SCHRITT);
        rows = rows.concat(liste.map(function (x) {
          var d = idx.nachPfad[x.pfad];
          return '<tr' + (d ? ' data-href="' + docHref(d.pfad) + '"' : '') + '><td><div class="titel">' + (d ? docLink(d, K.basisname(x.pfad)) : '<code>' + esc(x.pfad) + '</code>') + '</div>' + (d ? '<div class="pfad">' + esc(x.pfad) + '</div>' : '') + '</td><td class="befund">' + esc(x.text) + '</td></tr>';
        }));
        if (liste.length < s.nach[p].length) rows.push('<tr><td colspan="2"><button type="button" class="knopf" data-befunde="' + schl + '">Weitere ' + (s.nach[p].length - liste.length) + ' Befunde zu „' + esc(p) + '“ zeigen</button></td></tr>');
        return rows;
      }, []), 'pruef');
      h += '</section>';
    });
    var np = z.naechstesPruefdatum, ich = z.ichBloecke;
    h += block('Zeilen für die Übergabe', null,
      '<p class="leer">So gehören die vier Zahlenzeilen unter „Nicht vergessen“ in die nächste Übergabe. Ein Klick markiert alles zum Kopieren.</p>' +
      '<pre class="kopierblock" tabindex="0" aria-label="Zeilen für die Übergabe">' + esc(z.uebergabe.map(function (l) { return '- ' + l; }).join('\n')) + '</pre>' +
      '<p class="gezaehlt">' + z.seiten + ' Wiki-Seiten · Eingang ' + z.eingang + ' · Archiv ' + z.archiv + ' · Bestand ' + z.bestand + ' · nächstes Prüfdatum ' + (np ? K.datumDe(np.datum) : 'keins') +
      ' · Blöcke in deinen Worten: ' + ich.abgeglichen + ' mit der Rohdatei verglichen, ' + (ich.ohneRohdatei + ich.keinText) + ' ohne Rohdatei als Text.</p>' +
      '<details class="bericht-text"><summary>Bericht als Text, wie ihn dein Agent bekommt</summary><pre>' + esc(K.pruefberichtText(b, idx.vault)) + '</pre></details>' +
      '<p class="gezaehlt">Die Prüfpunkte und ihre Einstufung stehen in <code>agent/ablaeufe/pruefen.md</code>. Der Bestand zählt jede Datei in <code>quellen/bestand/</code>, auch eine <code>CLAUDE.md</code> darin; Dateien und Ordner mit Punkt vorn zählen nirgends.</p>');
    h += '</div>';
    haupt.innerHTML = h;
    Array.prototype.forEach.call(haupt.querySelectorAll('[data-befunde]'), function (k) {
      k.addEventListener('click', function () { var y = window.scrollY; offen[k.getAttribute('data-befunde')] = 1; zeigePruefung(offen); window.scrollTo(0, y); });
    });
  }

  /* ---------- Navigation ----------
     Alte Links bleiben gültig: #uebersicht, #liste/<reiter>?…, #auswertung, #pruefung, #doc/<pfad>[#anker]. */
  var SEITEN = { heute: 1, eingang: 1, leitfragen: 1, luecken: 1, widersprueche: 1, auswertung: 1, pruefung: 1, liste: 1 };
  function leseHash() {
    var h = location.hash.replace(/^#/, '');
    if (h.indexOf('doc/') === 0) {
      var rest = h.slice(4), k = rest.indexOf('#'), p = k < 0 ? rest : rest.slice(0, k), a = k < 0 ? '' : rest.slice(k + 1);
      try { p = decodeURIComponent(p); a = decodeURIComponent(a); } catch (e) { /* roh */ }
      return { ansicht: 'doc', pfad: p, anker: a };
    }
    var m = /^([a-z]+)(?:\/([a-z]+))?(?:\?(.*))?$/.exec(h);
    if (m && SEITEN[m[1]] === 1) {
      var par = {};
      (m[3] || '').split('&').forEach(function (x) { if (!x) return; var kv = x.split('='); try { par[decodeURIComponent(kv[0])] = decodeURIComponent(kv.slice(1).join('=')); } catch (e) { /* überspringen */ } });
      return { ansicht: m[1], reiter: m[2] || 'wiki', p: par };
    }
    return { ansicht: 'uebersicht' };
  }
  function route() {
    if (S.letzterHash) S.scroll[S.letzterHash] = window.scrollY;
    menue(false);
    if (!S.idx) { zeigeStart(); return; }
    var r = leseHash(), gescrollt = false;
    if (r.ansicht === 'doc') gescrollt = zeigeDoc(r.pfad, r.anker);
    else if (r.ansicht === 'liste') zeigeListe(r.reiter, r.p);
    else if (r.ansicht === 'eingang') zeigeListe('quellen', r.p, EINGANG);
    else if (r.ansicht === 'heute') zeigeHeute();
    else if (META[r.ansicht]) zeigeMeta(r.ansicht, r.p);
    else if (r.ansicht === 'auswertung') zeigeAuswertung();
    else if (r.ansicht === 'pruefung') zeigePruefung();
    else zeigeLagebild();
    if (!gescrollt) window.scrollTo(0, S.scroll[location.hash] || 0);
    S.letzterHash = location.hash;
  }
  window.addEventListener('hashchange', route);

  /* Einstieg */
  zeigeStart();
  if (hatFSA) griffHolen().then(function (h) { if (h && !S.idx) { S.letzter = h; zeigeStart(); } });
  window.FundusAnsicht = { einlesen: einlesen };
})();
</script>
